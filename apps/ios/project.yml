name: Bram
options:
  bundleIdPrefix: app.trybram
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages: {}
targets:
  Bram:
    type: application
    platform: iOS
    sources:
      - path: Bram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trybram.Bram
        PRODUCT_NAME: Bram
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bram
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    scheme:
      testTargets:
        - BramTests
  BramTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BramTests
    dependencies:
      - target: Bram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trybram.BramTests
        GENERATE_INFOPLIST_FILE: YES
