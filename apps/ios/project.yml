name: Bram
options:
  bundleIdPrefix: app.trybram
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios.git
    from: 6.9.5
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.0.0
targets:
  Bram:
    type: application
    platform: iOS
    sources:
      - path: Bram
    info:
      path: Bram/Info.plist
      properties:
        CFBundleDisplayName: Bram
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BramAIBackendEnabled: false
        BramAIDevRouteToken: ""
        BramAPIBaseURL: https://www.trybram.app
        BramPostHogProjectToken: $(BRAM_IOS_POSTHOG_PROJECT_TOKEN)
        BramPostHogHost: https://us.i.posthog.com
        BramRevenueCatAPIKey: $(BRAM_IOS_REVENUECAT_API_KEY)
        BramSupabaseURL: https://njotbjmpcostgktjjihv.supabase.co
        BramSupabasePublishableKey: sb_publishable_LovuYXBzXPbXevP8FuHSLA_wen7RoSQ
        BramAuthRedirectScheme: app.trybram.Bram
        CFBundleURLTypes:
          - CFBundleURLName: app.trybram.Bram
            CFBundleURLSchemes:
              - app.trybram.Bram
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSHealthShareUsageDescription: Bram reads workouts, active energy, heart rate, distance, and bodyweight to connect workout notes to progress.
        UIAppFonts:
          - AdobeCaslonPro-Regular.otf
          - AdobeCaslonPro-Semibold.otf
          - AdobeCaslonPro-Bold.otf
          - AdobeCaslonPro-Italic.otf
          - SuisseIntl-Book.otf
          - SuisseIntl-Regular.otf
          - SuisseIntl-Medium.otf
          - SuisseIntl-Semibold.otf
          - SuisseIntl-Bold.otf
          - SuisseIntl-RegularItalic.otf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trybram.Bram
        PRODUCT_NAME: Bram
        BRAM_IOS_POSTHOG_PROJECT_TOKEN: ""
        BRAM_IOS_REVENUECAT_API_KEY: "appl_hTooxCdvHUyRfGjseYYIyTuqFHC"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Bram/Bram.entitlements
        DEVELOPMENT_TEAM: 963UAMD46W
    dependencies:
      - package: RiveRuntime
      - package: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: PostHog
      - sdk: libsqlite3.tbd
      - sdk: HealthKit.framework
    scheme:
      testTargets:
        - BramTests
  BramTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BramTests
    dependencies:
      - target: Bram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trybram.BramTests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 963UAMD46W
